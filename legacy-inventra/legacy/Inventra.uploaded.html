<script>
/* Inventra core: pure business logic, no DOM, no globals. Works in browser (<script>) and Node (require). */
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.InventraCore=factory()})(typeof self!=='undefined'?self:this,function(){
'use strict';
const DAY=864e5,mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

/* ---------- dates: calendar days as 'YYYY-MM-DD', computed in UTC so DST/timezones can't shift them ---------- */
function parseISO(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const t=Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));return new Date(t).toISOString().slice(0,10)===s?t:null}
const toISO=t=>new Date(t).toISOString().slice(0,10);
const addDays=(s,n)=>toISO(parseISO(s)+n*DAY);
const diffDays=(a,b)=>Math.round((parseISO(b)-parseISO(a))/DAY);
const todayISO=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ---------- time-indexed demand history ---------- */
/* records: [{pid,date,qty}] -> dense daily array from start..end inclusive, zero-filled. */
function dailySeries(records,pid,start,end){const n=diffDays(start,end)+1;if(!(n>0))return[];const a=Array(n).fill(0);for(const r of records){if(r.pid!==pid)continue;const i=diffDays(start,r.date);if(i>=0&&i<n)a[i]+=r.qty}return a}

/* ---------- forecast methods (all use ONLY the series passed in) ---------- */
const METHODS={
 naive:{min:1,fn:(s,h)=>Array(h).fill(s[s.length-1])},
 ma7:{min:7,fn:(s,h)=>Array(h).fill(mean(s.slice(-7)))},
 ma14:{min:14,fn:(s,h)=>Array(h).fill(mean(s.slice(-14)))},
 ma28:{min:28,fn:(s,h)=>Array(h).fill(mean(s.slice(-28)))},
 /* average of the same weekday over the last 4 weeks (series must end the day before the forecast starts) */
 seasonal4:{min:28,fn:(s,h)=>Array.from({length:h},(_,k)=>{const t=s.length,w0=Math.floor(k/7)+1;return mean([0,1,2,3].map(j=>s[t+k-7*(w0+j)]))})}
};
function forecast(s,h,method){const M=METHODS[method];if(!M||s.length<M.min)return null;return M.fn(s,h).map(v=>Math.max(0,v))}

/* Rolling-origin backtest: for each origin t, forecast s[t..t+h) from s[0..t) only. Same origins for every method. */
function backtest(s,{h=7,minTrain=28,methods=Object.keys(METHODS)}={}){const out={};
 for(const m of methods){let ae=0,act=0,aeT=0,actT=0,bias=0,n=0,se=0,c=0;
  for(let t=Math.max(minTrain,METHODS[m].min);t+h<=s.length;t++){const f=forecast(s.slice(0,t),h,m);let ft=0,at=0;
   for(let i=0;i<h;i++){const e=f[i]-s[t+i];ae+=Math.abs(e);act+=s[t+i];se+=e*e;c++;ft+=f[i];at+=s[t+i]}
   aeT+=Math.abs(ft-at);actT+=at;bias+=ft-at;n++}
  out[m]=n?{n,dailyWape:act?ae/act:null,wape:actT?aeT/actT:null,bias:bias/n,rmse:Math.sqrt(se/c)}:null}
 return out}

/* Weekly pattern: share of variance explained by weekday (eta^2) AND the seasonal method must beat the flat average in backtest. Thresholds are heuristics. */
function weeklyPattern(s,bt){if(s.length<28)return{detected:false,eta2:null,reason:'Needs at least 28 days.'};
 const g=Array.from({length:7},()=>[]);s.forEach((v,i)=>g[i%7].push(v));const m=mean(s),sst=s.reduce((a,v)=>a+(v-m)**2,0);
 const ssb=g.reduce((a,x)=>a+x.length*(mean(x)-m)**2,0),eta2=sst?ssb/sst:0,a=bt&&bt.seasonal4,b=bt&&bt.ma14;
 return{eta2,detected:eta2>=0.15&&!!a&&!!b&&a.dailyWape!=null&&b.dailyWape!=null&&a.dailyWape<b.dailyWape*0.95}}

/* Choose a method from this product's own backtest. Selected on DAILY error (lead times rarely span whole weeks). Default ma14 unless another method is >=5% better with >=8 backtest windows. */
function chooseForecast(s,h=30){
 if(s.length<14)return{ok:false,reason:'Needs at least 14 days of dated sales history ('+s.length+' available).'};
 const bt=backtest(s,{h:7}),ref=bt.ma14,enough=!!ref&&ref.n>=8,warnings=[];let method='ma14';
 if(enough){const best=Object.entries(bt).filter(([,v])=>v&&v.dailyWape!=null).sort((x,y)=>x[1].dailyWape-y[1].dailyWape)[0];
  if(best&&best[0]!==method&&ref.dailyWape!=null&&best[1].dailyWape<ref.dailyWape*0.95)method=best[0]}
 else warnings.push('History too short to measure forecast accuracy (fewer than 8 backtest windows); using the 14-day average.');
 const w=weeklyPattern(s,bt);
 const sigma=enough?bt[method].rmse:Math.sqrt(mean(s.slice(-14).map(v=>(v-mean(s.slice(-14)))**2)));
 if(!enough)warnings.push('Safety stock uses demand variability, not measured forecast error.');
 return{ok:true,method,daily:forecast(s,h,method),sigma,weekly:w,warnings,
  accuracy:enough?{wapeDaily:bt[method].dailyWape,wape7d:bt[method].wape,windows:bt[method].n,basis:"rolling-origin backtest on this product's own history; not a guarantee of future accuracy"}:null,backtest:bt}}

/* ---------- restocking ---------- */
const Z=[[.5,0],[.8,.8416],[.9,1.2816],[.95,1.6449],[.97,1.8808],[.98,2.0537],[.99,2.3263]];
function zForService(p){if(p<=.5)return 0;if(p>=.99)return 2.3263;for(let i=1;i<Z.length;i++)if(p<=Z[i][0]){const[a,b]=[Z[i-1],Z[i]];return a[1]+(b[1]-a[1])*(p-a[0])/(b[0]-a[0])}}
function recommend(i){
 const{onHand,openPO=0,pendingQty=0,leadDays,coverDays=14,serviceLevel=.95,forecast:F,moq=0,packSize=1,maxLevel=null,shelfLifeDays=null}=i,W=[],R=[];
 if(!F||!F.ok)return{action:'no_forecast',qty:0,reasons:[(F&&F.reason)||'No forecast available.'],warnings:[]};
 if(!(leadDays>=0))return{action:'no_forecast',qty:0,reasons:['Lead time is missing for this product/supplier.'],warnings:[]};
 const f=F.daily,at=k=>k<f.length?f[k]:f[f.length-1],sum=(a,b)=>{let t=0;for(let k=a;k<b;k++)t+=at(k);return t};
 const L=Math.ceil(leadDays),ss=zForService(serviceLevel)*F.sigma*Math.sqrt(Math.max(L,1)),dLead=sum(0,L),rop=dLead+ss,pos=onHand+openPO;
 let cum=0,cover=null;for(let k=0;k<f.length;k++){cum+=f[k];if(cum>=onHand){cover=f[k]>0?k+(onHand-(cum-f[k]))/f[k]:k;break}}
 const base={reorderPoint:Math.ceil(rop),safetyStock:Math.ceil(ss),position:pos,daysOfCover:cover,leadDays:L};
 if(pendingQty>0)W.push(pendingQty+' units are already requested and awaiting approval (not counted in stock position).');
 if(pos>rop)return{...base,action:'none',qty:0,reasons:['Stock position ('+pos+') is above the reorder point ('+Math.ceil(rop)+').'],warnings:W};
 const upTo=sum(0,L+coverDays)+ss;let need=upTo-pos;
 R.push('Order-up-to level '+Math.ceil(upTo)+' = forecast demand over lead time + '+coverDays+' days ('+Math.round(sum(0,L+coverDays))+') + safety stock ('+Math.ceil(ss)+'); position is '+pos+' (on hand '+onHand+' + open orders '+openPO+').');
 if(shelfLifeDays!=null){const sellable=sum(L,L+shelfLifeDays)-Math.max(0,pos-dLead);if(need>sellable){need=Math.max(0,sellable);W.push('Quantity limited so new stock can sell within its '+shelfLifeDays+'-day shelf life.')}}
 if(need<=0)return{...base,action:'review',qty:0,reasons:R,warnings:[...W,'Stock is at or below the reorder point but the shelf-life limit leaves no sellable room. Review manually.']};
 let q=Math.ceil(need);if(packSize>1)q=Math.ceil(q/packSize)*packSize;
 if(moq>q){W.push('Raised to the supplier minimum order ('+moq+'), '+(moq-q)+' more than the calculated need.');q=packSize>1?Math.ceil(moq/packSize)*packSize:moq}
 if(maxLevel!=null&&pos+q>maxLevel)W.push('Order would bring stock position to '+(pos+q)+', above the maximum level ('+maxLevel+').');
 return{...base,action:'order',qty:q,orderUpTo:Math.ceil(upTo),reasons:R,warnings:W,needsReview:W.length>0}}

/* ---------- ledger integrity ---------- */
const OPEN_PO=['Approved','Sent to Supplier','Confirmed','Partially Received'],PENDING='Pending Approval';
const openPOQty=(reqs,pid)=>reqs.filter(r=>r.pid===pid&&OPEN_PO.includes(r.status)).reduce((a,r)=>a+r.qty-(r.got||0),0);
/* state: {products:[{id,stock,archived}], sales:[{pid,date,qty}], movements:[], requests:[]} ; mutates only on success */
function recordSale(st,{pid,date,qty,who='',today=todayISO()}){
 const p=st.products.find(x=>x.id===pid);if(!p||p.archived)return{ok:false,error:'Unknown or archived product.'};
 if(parseISO(date)==null)return{ok:false,error:'Date must be a valid YYYY-MM-DD.'};if(date>today)return{ok:false,error:'Sale date cannot be in the future.'};
 if(!(typeof qty==='number'&&isFinite(qty)&&qty>0))return{ok:false,error:'Quantity must be a positive number.'};
 if(qty>p.stock)return{ok:false,error:'Only '+p.stock+' units in stock.'};
 p.stock-=qty;const r=st.sales.find(x=>x.pid===pid&&x.date===date);if(r)r.qty+=qty;else st.sales.push({pid,date,qty});
 st.movements.unshift({pid,date,type:'Sale',qty:-qty,who});return{ok:true}}
function canDeleteProduct(st,pid){const b=st.requests.filter(r=>r.pid===pid&&(OPEN_PO.includes(r.status)||r.status===PENDING)).map(r=>'Request #'+r.id+' is '+r.status);return{ok:b.length===0,blockers:b}}
function archiveProduct(st,pid,today=todayISO()){const c=canDeleteProduct(st,pid);if(!c.ok)return{ok:false,error:'Resolve open orders first: '+c.blockers.join('; ')};const p=st.products.find(x=>x.id===pid);if(!p)return{ok:false,error:'Unknown product.'};p.archived=true;p.archivedOn=today;return{ok:true}}

/* ---------- CSV import with row-level validation ---------- */
function parseCSV(text){text=String(text).replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(q)throw new Error('Unterminated quoted field in CSV.');if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()!==''))}
const ALIAS={sku:['sku','itemcode','productcode'],name:['name','productname','product','description'],date:['date','day','saledate'],qty:['qty','quantity','units','unitssold'],onhand:['onhand','stock','quantityonhand'],cost:['cost','unitcost'],price:['price','sellingprice'],lead:['leaddays','leadtime','leadtimedays'],moq:['moq','minorder','minimumorderquantity'],pack:['packsize','pack'],max:['maxlevel','max','maximum'],shelf:['shelflifedays','shelflife'],category:['category','cat']};
function toObjects(rows){if(!rows.length)return{objs:[],cols:{}};const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,''),cols={};
 rows[0].forEach((h,i)=>{for(const k in ALIAS)if(ALIAS[k].includes(norm(h))&&!(k in cols))cols[k]=i});
 return{cols,objs:rows.slice(1).map((r,i)=>({_row:i+2,...Object.fromEntries(Object.entries(cols).map(([k,i])=>[k,(r[i]??'').trim()]))}))}}
const num=s=>/^\d+(\.\d+)?$/.test(s)?+s:NaN;
function validateSalesCSV(text,{skuToPid,today=todayISO()}){const errors=[],agg=new Map();let rows;
 try{rows=toObjects(parseCSV(text))}catch(e){return{records:[],errors:[{row:0,msg:e.message}],info:{}}}
 const miss=['sku','date','qty'].filter(k=>!(k in rows.cols));if(miss.length)return{records:[],errors:[{row:1,msg:'Missing required column(s): '+miss.join(', ')}],info:{}};
 let dup=0;const unknown=new Set();
 for(const r of rows.objs){const pid=skuToPid[r.sku],q=num(r.qty);let bad=null;
  if(!r.sku)bad='SKU is empty.';else if(pid===undefined){unknown.add(r.sku);bad='Unknown SKU "'+r.sku+'".'}
  else if(parseISO(r.date)==null)bad='Date "'+r.date+'" must be a valid YYYY-MM-DD.';else if(r.date>today)bad='Date '+r.date+' is in the future.';
  else if(!isFinite(q))bad='Quantity "'+r.qty+'" must be a non-negative number without thousands separators.';
  if(bad){errors.push({row:r._row,msg:bad});continue}
  const k=pid+'|'+r.date;if(agg.has(k)){agg.get(k).qty+=q;dup++}else agg.set(k,{pid,date:r.date,qty:q})}
 const records=[...agg.values()],ds=records.map(x=>x.date).sort();
 return{records,errors,info:{rows:rows.objs.length,accepted:rows.objs.length-errors.length,mergedSameDay:dup,from:ds[0]||null,to:ds[ds.length-1]||null,unknownSkus:[...unknown]}}}
/* Re-importing the same file is idempotent: imported (pid,date) pairs replace existing ones. */
function mergeSales(existing,incoming){const keys=new Set(incoming.map(r=>r.pid+'|'+r.date));return existing.filter(r=>!keys.has(r.pid+'|'+r.date)).concat(incoming)}
function validateProductsCSV(text,{existingSkus=[]}={}){const errors=[],out=[],seen=new Set(existingSkus);let rows;
 try{rows=toObjects(parseCSV(text))}catch(e){return{products:[],errors:[{row:0,msg:e.message}]}}
 const miss=['sku','name','onhand'].filter(k=>!(k in rows.cols));if(miss.length)return{products:[],errors:[{row:1,msg:'Missing required column(s): '+miss.join(', ')}]};
 const opt=[['cost','cost'],['price','price'],['lead','leadDays'],['moq','moq'],['pack','packSize'],['max','maxLevel'],['shelf','shelfLifeDays']];
 for(const r of rows.objs){const e=[];if(!r.sku)e.push('SKU is empty.');else if(seen.has(r.sku))e.push('Duplicate SKU "'+r.sku+'".');if(!r.name)e.push('Name is empty.');
  const p={sku:r.sku,name:r.name,category:r.category||'',onHand:num(r.onhand)};if(!isFinite(p.onHand))e.push('On-hand "'+r.onhand+'" must be a non-negative number.');
  for(const[k,f]of opt)if(k in rows.cols&&r[k]!==''){const v=num(r[k]);if(!isFinite(v))e.push(f+' "'+r[k]+'" must be a non-negative number.');else p[f]=v}
  if(p.packSize===0)e.push('packSize must be at least 1.');
  if(e.length)errors.push({row:r._row,msg:e.join(' '),});else{seen.add(r.sku);out.push(p)}}
 return{products:out,errors}}

return{parseISO,addDays,diffDays,todayISO,dailySeries,METHODS,forecast,backtest,weeklyPattern,chooseForecast,zForService,recommend,OPEN_PO,PENDING,openPOQty,recordSale,canDeleteProduct,archiveProduct,parseCSV,validateSalesCSV,mergeSales,validateProductsCSV}});

</script>

const daysLeft=p=>{const c=ch(p);if(!c.ok)return null;let cum=0;for(let k=0;k<c.daily.length;k++){cum+=c.daily[k];if(cum>=p.stock)return c.daily[k]>0?k+(p.stock-(cum-c.daily[k]))/c.daily[k]:k}return 999};
function rec(p){const c=ch(p);if(!c.ok)return null;const pend=S.R.filter(r=>r.pid==p.id&&r.status=='Pending Approval').reduce((a,r)=>a+r.qty,0);

<div class="bar" style="margin-top:12px"><label>Quantity <input id="cq" type="number" value="${q}" style="width:100px"></label></div><div id="fe" class="up"></div><button class="bt p" onclick="sub()">Send request to Head Office</button> <button class="bt" onclick="closeM()">Close</button>`)}
function sub(){const p=S.P.find(x=>x.id==CS.pid),q=+$('cq').value,s=SUP.find(x=>x.id==CS.sup);if(!Number.isInteger(q)||q<=0)return $('fe').textContent='Enter a positive whole quantity.';if(q<s.moq)return $('fe').textContent=`${s.name} requires at least ${s.moq} units.`;if(p.stock+openPO(p)+q>p.max*1.1)return $('fe').textContent=`This would exceed the maximum stock level (${p.max}).`;
const r={id:S.rid++,pid:p.id,qty:q,sup:s.id,price:quote(p,s),status:'Pending Approval',tl:[{t:now(),w:WHO(),m:`Created request: ${q} units from ${s.name} at ${m$(quote(p,s))}`}]};S.R.unshift(r);note('Request','High',`Restock request #${r.id} for ${p.name} (${q} units) awaits approval`,p.id,['head']);save();closeM();toast('Request sent to Head Office');go('orders')}
const OPEN=['Sent to Supplier','Confirmed','Partially Received'];
PG.orders=()=>{const u=S.user,R=S.R.filter(r=>u.role!='supplier'||(r.sup==u.sup&&!['Pending Approval','Rejected'].includes(r.status)));
return `<h1>${u.role=='supplier'?'Purchase orders':'Orders & Approvals'}</h1><p class="sub">Every step is time-stamped in the request timeline. Only authorised roles see each action.</p><div class="card tw">${R.length?`<table><tr><th>#</th><th>Product</th><th>Supplier</th><th>Qty</th><th>Value</th><th>Status</th><th>Actions</th></tr>${R.map(r=>{const p=S.P.find(x=>x.id==r.pid),s=SUP.find(x=>x.id==r.sup);let a='';
if(u.role=='head'&&r.status=='Pending Approval')a=`<button class="bt p s" onclick="act(${r.id},'approve')">Approve</button> <button class="bt s" onclick="act(${r.id},'modify')">Modify qty</button> <button class="bt s d" onclick="act(${r.id},'reject')">Reject</button>`;
if(u.role=='manager'&&r.status=='Pending Approval')a=`<button class="bt s d" onclick="act(${r.id},'cancel')">Cancel</button>`;
if(u.role=='supplier'&&r.status=='Sent to Supplier')a=`<button class="bt p s" onclick="act(${r.id},'confirm')">Confirm order</button>`;
if(u.role=='warehouse'&&['Confirmed','Partially Received'].includes(r.status))a=`<button class="bt p s" onclick="act(${r.id},'receive')">Record delivery</button>`;
return `<tr><td>PO-${1000+r.id}</td><td>${(p||S.archived.find(x=>x.id==r.pid)||{name:'Unknown product'}).name}</td><td>${s.name}</td><td>${r.qty}${r.got?` (${r.got} received)`:''}</td><td>${m$(r.qty*r.price)}</td><td><span class="b ${['Rejected','Cancelled'].includes(r.status)?'w':r.status=='Pending Approval'?'n':''}">${r.status}</span></td><td><button class="bt s" onclick="tlv(${r.id})">Timeline</button> ${a}</td></tr>`}).join('')}</table>`:'<div class="empty">No orders yet. Create a restock request from Smart Restocking.</div>'}</div>`};
function tlv(id){const r=S.R.find(x=>x.id==id);modal(`<h1>PO-${1000+id} timeline</h1><div class="tlv">${r.tl.map(t=>`<div><b>${t.m}</b><br><span class="sub" style="margin:0">${t.t} · ${t.w}</span></div>`).join('')}</div><button class="bt" onclick="closeM()">Close</button>`)}
function act(id,a){const r=S.R.find(x=>x.id==id),p=S.P.find(x=>x.id==r.pid),u=S.user.role,ok={approve:'head',modify:'head',reject:'head',cancel:'manager',confirm:'supplier',receive:'warehouse'};
if(ok[a]!=u)return toast('You are not authorised for this action',1);const L=(m)=>r.tl.push({t:now(),w:WHO(),m});
if(a=='modify'){const q=+prompt('New quantity',r.qty);if(!Number.isInteger(q)||q<=0)return toast('Invalid quantity',1);L(`Modified quantity ${r.qty} → ${q}`);r.qty=q;toast('Quantity updated');save();return render()}
if(a=='approve'){r.status='Approved';L('Approved');r.status='Sent to Supplier';r.tl.push({t:now(),w:'System',m:`Purchase order PO-${1000+id} generated and sent to ${SUP.find(s=>s.id==r.sup).name}`});note('Request','Medium',`Request #${id} approved. PO sent to supplier`,p.id,['manager','head']);toast('Approved. PO sent to supplier')}
if(a=='reject'){const why=prompt('Reason for rejection?','');if(why===null)return;r.status='Rejected';L('Rejected'+(why?': '+why:''));note('Request','High',`Request #${id} for ${p.name} was rejected`,p.id,['manager']);toast('Request rejected')}
if(a=='cancel'){r.status='Cancelled';L('Cancelled');toast('Request cancelled')}
if(a=='confirm'){const e=+prompt('Estimated delivery in days',SUP.find(s=>s.id==r.sup).lead);if(!e||e<0)return toast('Enter a valid number of days',1);r.status='Confirmed';r.eta=e;L(`Confirmed order, ETA ${fd(e)}`);note('Quote','Medium',`Supplier confirmed PO-${1000+id}, delivery ${fd(e)}`,p.id,['manager','head']);toast('Order confirmed')}
if(a=='receive'){const left=r.qty-(r.got||0),q=+prompt(`Quantity received (max ${left})`,left);if(!Number.isInteger(q)||q<=0||q>left)return toast(`Enter a whole number between 1 and ${left}`,1);r.got=(r.got||0)+q;p.stock+=q;S.mv.unshift({pid:p.id,t:now(),type:'Purchase',q,who:WHO()});r.status=r.got>=r.qty?'Received':'Partially Received';L(`Received ${q} units. Stock updated to ${p.stock}`);if(r.status=='Received')r.tl.push({t:now(),w:'System',m:'Order completed'});note('Stock','Low',`${q} units of ${p.name} received; stock is now ${p.stock}`,p.id,['manager','head']);toast('Delivery recorded, stock updated')}
save();render()}
PG.forecast=()=>{const p=S.P.find(x=>x.id==selP)||S.P[0],s=sl(p),f=fc(p,30);
if(f){const h0=s.slice(-30),h=[...Array(30-h0.length).fill(null),...h0],lb=Array.from({length:30+14},(_,i)=>fd(i-30));const bt=h.map((_,i)=>{const t=s.length-30+i,r=t>=28?C.forecast(s.slice(0,t),1,f.c.method):null;return r?Math.round(r[0]):null});chart('fc','line',lb,[ds('Actual',[...h,...Array(14).fill(null)],0),ds('Back-test (1-day-ahead, using only earlier data)',[...bt,...Array(14).fill(null)],3,{borderDash:[2,3]}),ds('Forecast',[...Array(29).fill(null),h[29],...f.days.slice(0,14).map(Math.round)],1,{borderDash:[5,4]})])}
const rows=S.P.map(q=>({q,f7:fc(q,7),f14:fc(q,14),f30:fc(q,30)}));
return `<h1>Sales Forecast</h1><p class="sub">The method is chosen per product by backtesting simple models on that product's own dated sales history. Estimates, not guarantees.</p><div class="bar"><select onchange="selP=+this.value;render()">${S.P.map(x=>`<option value="${x.id}" ${x.id==p.id?'selected':''}>${x.name}</option>`).join('')}</select></div>
<div class="card">${f?`<h3>${p.name}: actual vs forecast</h3><div class="cv"><canvas id="fc"></canvas></div><p class="sub" style="margin:8px 0 0">${accTxt(f.c)} Method: ${f.c.method}. Demand is ${f.trend>1.1?'increasing':f.trend<.9?'decreasing':'stable'} vs the prior month (${Math.round((f.trend-1)*100)}%). ${f.c.weekly.detected?'Weekly pattern detected (weekday explains '+Math.round(f.c.weekly.eta2*100)+'% of variance).':'No reliable weekly pattern detected.'} Days of cover: ${Math.round(Math.min(99,daysLeft(p)))}.</p>`:`<div class="empty">Not enough sales history for ${p.name} (${s.length} days). At least 14 days of sales are needed for a reliable forecast.</div>`}</div>
<div class="card tw" style="margin-top:14px"><table><tr><th>Product</th><th>7 days</th><th>14 days</th><th>30 days</th><th>Revenue (30d)</th><th>Trend</th><th>Typical daily error</th><th>Recommended stock</th></tr>${rows.map(x=>x.f7?`<tr><td>${x.q.name}</td><td>${Math.round(x.f7.sum)}</td><td>${Math.round(x.f14.sum)}</td><td>${Math.round(x.f30.sum)}</td><td>${m$(x.f30.sum*x.q.price)}</td><td class="${x.f7.trend>1.1?'dn':x.f7.trend<.9?'up':''}">${x.f7.trend>1.1?'▲ rising':x.f7.trend<.9?'▼ declining':'● stable'}</td><td>${x.f7.c.accuracy?Math.round(x.f7.c.accuracy.wapeDaily*100)+'%':'n/a'}</td><td>${Math.round(x.f14.sum+C.zForService(.95)*x.f7.c.sigma*Math.sqrt(x.q.lead))}</td></tr>`:`<tr><td>${x.q.name}</td><td colspan="7" class="sub">More sales data required</td></tr>`).join('')}</table></div>`};
PG.price=()=>{const p=S.P.find(x=>x.id==selP)||S.P[0],px=S.px[p.id],w=S.watch.includes(p.id);
chart('pc','line',Array.from({length:30},(_,i)=>fd(i-29)),SUP.map((s,i)=>ds(s.name,px[s.id],i)),{z:false});
const al=[];S.P.forEach(q=>SUP.forEach(s=>{const a=S.px[q.id][s.id],c=(a[29]/a[0]-1)*100;if(Math.abs(c)>=5)al.push([c<0?'':'w',`${s.name} ${c<0?'reduced':'raised'} the price of ${q.name} by ${Math.abs(c).toFixed(0)}% over 30 days.`])}));
S.alerts.forEach(a=>{const q=S.P.find(x=>x.id==a.pid),b=Math.min(...SUP.map(s=>quote(q,s)));if(b<=a.below)al.unshift(['','Alert triggered: '+q.name+' is quoted at '+m$(b)+', at or below your '+m$(a.below)+' threshold.'])});
const best=SUP.map(s=>quote(p,s)),lo=Math.min(...best),a30=avg(Object.values(px).flat()),f=fc(p,30),sav=((a30-lo)*(f?f.sum:0));
return `<h1>Price Intelligence</h1><p class="sub">Simulated recorded supplier quotes, not live market prices.</p><div class="bar"><select onchange="selP=+this.value;render()">${S.P.map(x=>`<option value="${x.id}" ${x.id==p.id?'selected':''}>${(S.watch.includes(x.id)?'★ ':'')+x.name}</option>`).join('')}</select><button class="bt s" onclick="wt(${p.id})">${w?'Remove from watchlist':'Add to watchlist'}</button></div>
<div class="grid g2"><div class="card"><h3>30-day purchase price by supplier</h3><div class="cv"><canvas id="pc"></canvas></div></div><div class="card tw"><table><tr><th>Supplier</th><th>Current</th><th>Previous</th><th>Change</th><th>30d low</th></tr>${SUP.map(s=>{const a=px[s.id],c=a[29]-a[28],t=(a[29]/a[0]-1)*100;return `<tr><td>${s.name}</td><td><b>${m$(a[29])}</b></td><td>${m$(a[28])}</td><td class="${t<0?'dn':'up'}">${t<0?'▼':'▲'} ${Math.abs(t).toFixed(1)}% (${m$(Math.abs(a[29]-a[0]))})</td><td>${m$(Math.min(...a))}</td></tr>`}).join('')}</table><p class="sub" style="margin-top:10px">Spread between highest and lowest current quote: <b>${lo>0?((Math.max(...best)/lo-1)*100).toFixed(1)+'%':'n/a'}</b> (simulated quotes).</p>
<div class="bar"><label>Alert when best quote falls below $<input id="ab" type="number" step="0.01" style="width:90px" value="${(lo*.95).toFixed(2)}"></label><button class="bt p s" onclick="sa(${p.id})">Set alert</button></div>${S.alerts.filter(a=>a.pid==p.id).map(a=>`<div class="ins">Alert: below ${m$(a.below)}</div>`).join('')}</div></div>
<div class="card" style="margin-top:14px"><h3>Price alerts</h3>${al.map(i=>`<div class="ins ${i[0]}">${i[1]}</div>`).join('')||'<div class="empty">No price moves over 5% in the last 30 days.</div>'}</div>`};
function wt(id){S.watch=S.watch.includes(id)?S.watch.filter(x=>x!=id):[...S.watch,id];save();toast('Watchlist updated');render()}
function sa(id){const v=+$('ab').value;if(!(v>0))return toast('Enter a price above 0',1);S.alerts.push({pid:id,below:v});note('Price','Low','Alert set for '+S.P.find(p=>p.id==id).name+' below '+m$(v),id,['manager','head']);save();toast('Alert saved');render()}
let NF={c:'',p:''};
PG.notif=()=>{const L=S.N.filter(n=>n.to.includes(S.user.role)&&(!NF.c||n.cat==NF.c)&&(!NF.p||n.pri==NF.p));return `<h1>Notifications</h1><div class="bar"><select onchange="NF.c=this.value;render()"><option value="">All categories</option>${[...new Set(S.N.map(n=>n.cat))].map(c=>`<option ${NF.c==c?'selected':''}>${c}</option>`).join('')}</select><select onchange="NF.p=this.value;render()"><option value="">All priorities</option>${['High','Medium','Low'].map(c=>`<option ${NF.p==c?'selected':''}>${c}</option>`).join('')}</select><button class="bt s" onclick="S.N.forEach(n=>n.read=true);save();render()">Mark all read</button></div>
<div class="card">${L.map(n=>`<div class="ins ${n.pri=='High'?'w':''}" style="${n.read?'opacity:.6':''}"><b>${n.msg}</b><br><span class="sub" style="margin:0">${n.t} · ${n.cat} · ${n.pri}</span> <button class="bt s" onclick="nr(${n.id},'${n.cat}')">${n.cat=='Request'?'Open orders':n.cat=='Price'?'View prices':'View stock'}</button></div>`).join('')||'<div class="empty">You are all caught up.</div>'}</div>`};
function nr(id,c){const n=S.N.find(x=>x.id==id);n.read=true;if(n.pid)selP=n.pid;save();const k=c=='Request'||c=='Quote'?'orders':c=='Price'?'price':'inv';go(NAV[S.user.role].includes(k)?k:'notif')}
load();render();
</script></body></html>
